name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Python and xterm
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip xterm
          python3 --version
          dpkg -s xterm | grep -i '^Version'
