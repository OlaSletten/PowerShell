name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Update package lists
        run: sudo apt-get update
      - name: Install Python, pip, and xterm
        run: sudo apt-get install -y python3 python3-pip xterm
      - name: Verify Python and pip
        run: |
          python3 --version
          pip3 --version
      - name: Verify xterm
        run: dpkg -s xterm | grep -i '^Version'
